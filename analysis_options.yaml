# This file configures the static analysis results for your project (errors,
# warnings, and lints).
#
# This enables the lint set from `package:very_good_analysis`, Very Good
# Ventures' ruleset. It is stricter than `package:lints`, the set it replaces
# here: on top of catching problems that may arise when running or consuming
# Dart code, it enforces documentation, formatting, and style conventions
# meant to keep a codebase consistent as it grows.

include: package:very_good_analysis/analysis_options.yaml

