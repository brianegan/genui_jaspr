name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Formatting, analysis, and the VM suite for the published library. Coverage is
  # held at 100%: everything `lib/` exposes is reachable from a VM test.
  #
  # `example/` is a workspace member and is deliberately not checked here. Its
  # `chat.dart` is an `@client` component that no VM test can enter, so its bar
  # and its browser coverage are decided separately.
  verify-dart:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1
    with:
      dart_sdk: stable
      min_coverage: 100
      # There is no bloc in this package, so the default lint pass would only
      # activate bloc_tools for nothing.
      run_bloc_lint: false

  # The hops a VM test cannot reach: a real keystroke in a real input element
  # writing to the data model, and a real click on a generated button.
  #
  # This is hand-written rather than another `dart_package.yml` job with
  # `platform: chrome`. Only `test/browser` is annotated `@TestOn('browser')`,
  # so pointing Chrome at the whole suite would try to run the server-rendering
  # tests in a browser, where they fail on `Platform._environment`.
  browser-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🧪 Run Browser Tests
        run: dart test -p chrome test/browser

  # 140 is the score this package gets today. The 20 missing points are a missing
  # LICENSE and pana not recognising `example/` as an example, both tracked
  # separately. The version is pinned so a pana release cannot move the bar on
  # its own.
  verify-pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v1
    with:
      pana_version: 0.23.15
      min_score: 140

  # PR titles become squash-merge commit titles, so they are the changelog.
  verify-semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  # `allowed` is deliberately empty. The workflow always passes both --allowed and
  # --forbidden, and very_good_cli rejects being given the two together, so one of
  # them has to be blank. Forbidding "unknown" is the right half to keep: the
  # dependency tree already pulls in BSD-3-Clause-HP, which an allow-list built
  # from VGV's default of MIT/BSD-3-Clause/BSD-2-Clause/Apache-2.0 would reject.
  verify-license-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      dependency_type: "direct-main,transitive"
      allowed: ""
      forbidden: "unknown"

  # Checks the whole repo rather than only the files a PR touched, so the
  # dictionary in .github/cspell.json stays honest about what is already here.
  verify-spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      modified_files_only: false
