name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Formatting, analysis, and the VM suite for the published library.
  #
  # `example/` is a workspace member with its own bar, checked by verify-example
  # below: its `chat.dart` is an `@client` component that no VM test can enter,
  # so its 100% needs VM and browser coverage merged.
  verify-dart:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/dart_package.yml@v1
    with:
      dart_sdk: stable
      # min_coverage defaults to 100 and dart_package.yml passes
      # `--min-coverage` unconditionally, so it must be set here, not just
      # omitted, to actually disable it. very_good_cli's own coverage check
      # does not honor this package's `coverage:ignore` comments even with
      # its own `check_ignore: true` (its `HitMap.parseFiles` resolves
      # `packagePath` in a way that never finds this package's sources), so
      # letting it enforce a bar here would fail this job over lines the bar
      # deliberately excludes. Coverage is enforced by verify-coverage
      # instead, which reads those comments correctly.
      min_coverage: 0
      # There is no bloc in this package, so the default lint pass would only
      # activate bloc_tools for nothing.
      run_bloc_lint: false
      # `test_optimization` is deliberately left on. The generated entrypoint
      # only chokes on `test/browser` when the run has no `--platform vm`, and
      # `platform` defaults to vm here, so every test in test/ (excluding
      # test/browser) compiles and passes under the optimizer. Drop the
      # optimization only if that default ever changes.

  # Coverage is held at 100%: everything `lib/` exposes is reachable from a VM
  # test, or, for the few lines only a browser can execute, from the
  # browser-test job below with a `coverage:ignore` comment saying so.
  #
  # Hand-written rather than `verify-dart`'s own `min_coverage`, because
  # `very_good_cli`'s coverage check does not honor those comments in this
  # package: its `HitMap.parseFiles` resolves `packagePath` in a way that
  # never finds this package's sources, so the markers are silently never
  # read and it reports the bar below where the ignored lines put it.
  # `format_coverage --check-ignore` reads them correctly, so `tool/coverage.sh`
  # runs that directly, the same way `example/tool/coverage.sh` already does.
  verify-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🧪 Check Coverage
        run: ./tool/coverage.sh

  # The hops a VM test cannot reach: a real keystroke in a real input element
  # writing to the data model, and a real click on a generated button.
  #
  # This is hand-written rather than another `dart_package.yml` job with
  # `platform: chrome`. Only `test/browser` is annotated `@TestOn('browser')`,
  # so pointing Chrome at the whole suite would try to run the server-rendering
  # tests in a browser, where they fail on `Platform._environment`.
  browser-test:
    runs-on: ubuntu-latest

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: 🧪 Run Browser Tests
        run: dart test -p chrome test/browser

  # The example package, at the same bar as the library. This is hand-written
  # rather than a `dart_package.yml` job with `working_directory: example`
  # because the reusable workflow runs one `very_good dart test` and cannot
  # merge a browser coverage report into the VM one, which is the only way
  # `chat.dart` gets counted. tool/coverage.sh holds the merged bar at 100%,
  # and the local gate runs the same script.
  verify-example:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: example

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v6

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1.7.2
        with:
          sdk: stable

      - name: 📦 Install Dependencies
        run: dart pub get

      - name: ✨ Check Formatting
        run: dart format --set-exit-if-changed lib test tool

      - name: 🕵️ Analyze
        run: dart analyze --fatal-infos lib test tool

      - name: 🧪 Test With Merged Coverage
        run: ./tool/coverage.sh

  # The full score: the LICENSE and the example README closed the last two gaps.
  # The version is pinned so a pana release cannot move the bar on its own.
  verify-pana:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/pana.yml@v1
    with:
      pana_version: 0.23.15
      min_score: 160

  # PR titles become squash-merge commit titles, so they are the changelog.
  verify-semantic-pull-request:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/semantic_pull_request.yml@v1

  # `allowed` is deliberately empty. The workflow always passes both --allowed and
  # --forbidden, and very_good_cli rejects being given the two together, so one of
  # them has to be blank. Forbidding "unknown" is the right half to keep: the
  # dependency tree already pulls in BSD-3-Clause-HP, which an allow-list built
  # from VGV's default of MIT/BSD-3-Clause/BSD-2-Clause/Apache-2.0 would reject.
  verify-license-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/license_check.yml@v1
    with:
      dependency_type: "direct-main,transitive"
      allowed: ""
      forbidden: "unknown"

  # Checks the whole repo rather than only the files a PR touched, so the
  # dictionary in .github/cspell.json stays honest about what is already here.
  verify-spell-check:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/spell_check.yml@v1
    with:
      modified_files_only: false
