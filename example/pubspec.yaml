name: genui_jaspr_example
description: >-
  A Jaspr app that drives a GenUI conversation, with the model call behind a
  server route so the API key stays off the client.
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  a2ui_core: ^0.1.0
  genkit: ^0.15.1
  genkit_google_genai: ^0.2.12
  genkit_shelf: ^0.1.11
  genui_jaspr: ^0.2.0
  jaspr: ^0.23.2
  shelf: ^1.4.0
  # Used by the chat component to scroll the conversation. Safe on the server
  # too:
  # it is the same package Jaspr's own event types come from.
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.4.0
  # Compiles the generated client entrypoint to the JavaScript the page loads.
  # Without it there is no main.client.dart.js, so the @client component never
  # hydrates and the page renders once and then ignores every click.
  build_web_compilers: ^4.8.0
  coverage: ^1.15.1
  jaspr_builder: ^0.23.2
  jaspr_test: ^0.23.2
  lints: ^6.0.0
  test: ^1.26.2

jaspr:
  mode: server
