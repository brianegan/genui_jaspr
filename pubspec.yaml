name: genui_jaspr
description: >-
  Render A2UI generative user interfaces in Jaspr, so a web app can offer a
  generative UI without shipping Flutter web.
version: 0.1.0
repository: https://github.com/brianegan/genui_jaspr

environment:
  sdk: ^3.12.0

workspace:
  - example

dependencies:
  # The A2UI protocol runtime: messages, data model, expressions, binder.
  # Also re-exports the preact_signals primitives the binder resolves through,
  # which is why preact_signals is not a direct dependency here.
  a2ui_core: ^0.1.1
  jaspr: ^0.23.4
  # Schema appears in the public API and a2ui_core does not re-export it.
  json_schema_builder: ^0.1.6
  # The DOM types Jaspr itself uses, with stubs on the server. Needed to keep a
  # textarea's value in step with the data model.
  universal_web: ^1.1.1

dev_dependencies:
  jaspr_test: ^0.23.4
  test: ^1.26.2
  very_good_analysis: ^10.3.0
